<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Reaction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+JP:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="intro">
        <p class="eyebrow">MINI BROWSER GAME / 01</p>
        <h1>COLOR<br /><span>REACTION</span></h1>
        <p class="description">色が変わった瞬間にボタンを押そう。早いほどスコアが伸びます。</p>
      </section>

      <section class="game-card" aria-live="polite">
        <div class="stats">
          <div><span>BEST</span><strong id="bestScore">--</strong></div>
          <div><span>LAST</span><strong id="lastScore">--</strong></div>
        </div>

        <button id="reactionButton" class="reaction-button" type="button">
          <span id="buttonMessage">START</span>
          <small id="buttonHint">クリックして開始</small>
        </button>

        <p id="status" class="status">準備ができたら START を押してください。</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
